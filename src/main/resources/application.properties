spring.application.name=ollama-sample

# Ollama API Configuration
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.embedding.enabled=true

# Embedding Model Configuration
spring.ai.ollama.embedding.options.model=twine/mxbai-embed-xsmall-v1

# Weather API Configuration
weather.api.key=${WEATHER_API_KEY}
weather.api.url=http://api.weatherapi.com/v1/current.json

# PostgreSQL Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=root

# JPA/Hibernate Configuration (important for pgvector)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# PgVector Configuration - IMPORTANT: Check the actual dimension of your embedding model
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false
spring.ai.vectorstore.pgvector.schema-validation=false
spring.ai.vectorstore.pgvector.initialize-schema=true

#Enable docker logging
logging.level.org.springframework.boot.docker.compose=DEBUG

# Enable debug logging for Spring AI Ollama
logging.level.org.springframework.ai.ollama=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.vectorstore.pgvector=DEBUG

# Ollama client logging
logging.level.org.springframework.ai.ollama.OllamaChatModel=TRACE
logging.level.org.springframework.ai.ollama.api.OllamaApi=DEBUG

# If you want to see the actual JSON requests/responses to Ollama
logging.level.org.springframework.ai.ollama.client=TRACE

# Enable REST template/WebClient logging for HTTP requests
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG

# Enable HTTP wire logging (shows actual HTTP requests/responses)
logging.level.org.apache.http.wire=DEBUG
logging.level.org.apache.http.headers=DEBUG

# Spring Web logging for your REST controllers
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG

# Root logging level
logging.level.root=INFO

# Optional: Format logs nicely
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n